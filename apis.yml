name: NOD Games
description: NOD Games is a Seoul-based blockchain game studio founded in 2019 by CEO
  Chanki Lee, building entertaining game content and open, player-owned game platforms
  where gamers and communities own and trade in-game digital assets as NFTs. Its marquee
  titles are League of Kingdoms, a free-to-play 4X MMO strategy game with tradable
  Land NFTs and the LOKA token, and Crypto Sword & Magic, an RPG whose heroes, equipment,
  and pets are recorded on-chain with game logic running in smart contracts. The company
  is backed by a16z crypto. As of this enrichment pass NOD Games publishes no first-party
  developer program, public API, SDK, or GitHub organization; its official domain
  nodgames.com resolves to an unconfigured Wix parking page and the League of Kingdoms
  domain no longer resolves, so there is no live API surface to catalog.
